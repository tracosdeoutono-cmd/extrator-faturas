name: Extrair e Descarregar Faturas

on:
  workflow_dispatch: # Permite-te correr o script apenas quando clicas no botão

jobs:
  download_invoices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Carregar os ficheiros do repositório
        uses: actions/checkout@v4
        
      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar ferramentas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF requests
          
      - name: Executar o Script (A descarregar faturas...)
        run: python download_invoices.py
        
      - name: Disponibilizar o ZIP para Download
        uses: actions/upload-artifact@v4
        with:
          name: Faturas-Airbnb-ZIP
          path: todas_as_faturas.zip
          retention-days: 7
